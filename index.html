<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Transfer 19 Scanner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Standalone build for GitHub Pages. Simple white layout: scan box, result, search, log. Light theme only by request. */
:root{
  --bg:#ffffff; --soft:#f6f7f8; --line:#e3e6e9; --fg:#1d2329; --muted:#6b747d;
  --accent:#1f6feb; --ok:#14804a; --ok-bg:#ecf8f1; --warn:#c62828; --warn-bg:#fdecec;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45}
.wrap{max-width:820px;margin:0 auto;padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
h1{font-size:22px;font-weight:700;margin:0}
.top p{margin:2px 0 0;color:var(--muted);font-size:13px}
label.lbl{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.row{display:flex;gap:8px}
.input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--fg);font:500 18px var(--font);padding:12px 14px;outline:none}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,111,235,.15)}
#code{font-size:22px;letter-spacing:.03em;font-variant-numeric:tabular-nums}
.btn{font:600 15px var(--font);border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--fg);padding:0 16px;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:hover{background:var(--soft)} .btn.primary:hover{background:#1a5fd0}
.btn:focus-visible{outline:3px solid rgba(31,111,235,.35);outline-offset:2px}
.btn:disabled{opacity:.5}

.result{border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:12px;background:#fff}
.result.ok{border-color:var(--ok);background:var(--ok-bg)}
.result.bad{border-color:var(--warn);background:var(--warn-bg);border-width:2px}
.status{font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.04em}
.ok .status{color:var(--ok)} .bad .status{color:var(--warn)} .idle .status{color:var(--muted)}
.desc{font-size:clamp(20px,4vw,26px);font-weight:700;margin:0;line-height:1.25;overflow-wrap:anywhere}
.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.field{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.field .k{font-size:12px;color:var(--muted);font-weight:500}
.field .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.field.qty .v{font-size:28px;color:var(--accent)}
.note{font-size:13px;color:#8a5a00;background:#fff6e0;border:1px solid #f1d9a0;border-radius:8px;padding:4px 10px;justify-self:start}
.warnmsg{font-size:18px;font-weight:600;margin:0;color:var(--warn)}
.muted{color:var(--muted);margin:0}
.linkbtn{background:none;border:0;color:var(--accent);font:600 15px var(--font);padding:0;cursor:pointer;justify-self:start;text-decoration:underline}

.results{border:1px solid var(--line);border-radius:10px;margin-top:8px;max-height:340px;overflow:auto}
.results:empty{display:none}
.item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#fff;border:0;border-bottom:1px solid var(--line);padding:10px 12px;font:inherit;color:inherit;cursor:pointer}
.item:last-child{border-bottom:0}
.item:hover,.item:focus-visible{background:var(--soft);outline:none}
.item .d{flex:1;min-width:0}
.item .d b{display:block;font-weight:600;overflow-wrap:anywhere}
.item .d span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.item .q{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.nores{padding:14px;color:var(--muted)}

.section-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.section-h h2{font-size:16px;margin:0}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted)}
.stats b{color:var(--fg);font-variant-numeric:tabular-nums}
.stats b.red{color:var(--warn)}
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tabs button{border:0;background:#fff;color:var(--muted);font:600 13px var(--font);padding:6px 12px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--fg);color:#fff}
.log{border:1px solid var(--line);border-radius:10px;max-height:380px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{position:sticky;top:0;background:var(--soft);text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
td.r{text-align:right}
tr.bad td{background:var(--warn-bg)}
.tag{font-size:11px;font-weight:700;color:#fff;background:var(--warn);border-radius:5px;padding:2px 6px}
.small{font-size:12px;color:var(--muted)}
.empty{padding:22px;text-align:center;color:var(--muted)}
.foot{display:flex;flex-wrap:wrap;gap:8px}
.foot .btn{padding:9px 14px;font-size:14px}
.notice{font-size:13px;color:#8a5a00;background:#fff6e0;border-radius:8px;padding:8px 12px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:560px){.fields{grid-template-columns:1fr 1fr}.field.qty{grid-column:1/-1}.hide-sm{display:none}#code{font-size:19px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Transfer 19 Scanner</h1>
    <p><span id="itemCount"></span> materials · <span id="unitCount"></span> units</p>
  </div>

  <form id="scanForm" autocomplete="off">
    <label class="lbl" for="code">Scan barcode</label>
    <div class="row">
      <input class="input" id="code" inputmode="numeric" enterkeyhint="go" autocomplete="off" spellcheck="false" placeholder="Scan or type barcode" autofocus>
      <button class="btn primary" type="submit">Check</button>
      <button class="btn" type="button" id="camBtn" title="Take a photo of the barcode">Camera</button>
    </div>
    <input type="file" id="camFile" accept="image/*" capture="environment" hidden>
  </form>

  <section class="result idle" id="result" aria-live="assertive">
    <div class="status">Ready</div>
    <p class="muted">Scan an item to see its description, material code and quantity.</p>
  </section>

  <div>
    <label class="lbl" for="search">Search by material code or description</label>
    <input class="input" id="search" type="search" autocomplete="off" spellcheck="false" placeholder="e.g. 200015 or accu chek strips">
    <div class="results" id="results"></div>
  </div>

  <section>
    <div class="section-h">
      <h2>Scan log <span class="small">(this device)</span></h2>
      <div class="tabs" role="group" aria-label="Filter log">
        <button type="button" data-f="all" aria-pressed="true">All</button>
        <button type="button" data-f="bad" aria-pressed="false">Not listed</button>
      </div>
    </div>
    <div class="stats" style="margin-bottom:8px">
      <span>Checked <b id="sChecked">0</b></span>
      <span>Remaining <b id="sLeft">0</b></span>
      <span>Scans <b id="sScans">0</b></span>
      <span>Not listed <b class="red" id="sBad">0</b></span>
    </div>
    <div class="log" id="log"></div>
  </section>

  <div class="foot">
    <button class="btn" type="button" id="exportBtn">Export scan log</button>
    <button class="btn" type="button" id="exportLeft">Export remaining items</button>
    <button class="btn" type="button" id="clearBtn">Clear log</button>
  </div>
  <div class="notice" id="notice" hidden></div>
</div>

$('unitCount').textContent = fmt(units);

function clean(raw) {
  return String(raw || '').replace(/[\u0000-\u001f\u007f\s]/g, '').replace(/^\][A-Za-z]\d/, '');
}
function lookup(code) {
  if (!code) return null;
  if (byBarcode.has(code)) return { item: byBarcode.get(code), via: 'barcode' };
  const st = code.replace(/^0+/, '');
  if (st && byStripped.has(st)) return { item: byStripped.get(st), via: 'barcode' };
  if (byMat.has(code)) return { item: byMat.get(code), via: 'material' };
  return null;
}

let scans = [], filter = 'all';
try { scans = JSON.parse(localStorage.getItem('t19-scans') || '[]') || []; } catch (e) { scans = []; }

// sound + vibration
let actx = null;
function tone(f, d, w = 0, type = 'sine', v = .15) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + w;
    o.type = type; o.frequency.value = f; o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.start(t); o.stop(t + d + .02);
  } catch (e) {}
}
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

function showItem(it, via) {
  const prior = scans.filter(s => s.ok && s.mat === it.mat).length;
  const notes = [];
  if (via === 'material') notes.push('Matched by material code');
  if (via === 'search') notes.push('Found by search');
  if (it.qty === 0) notes.push('Quantity is 0');
  if (prior > 0) notes.push('Already checked ' + prior + '×');
  const el = $('result');
  el.className = 'result ok';
  el.innerHTML = `<div class="status">✓ Listed</div>
    <h2 class="desc">${esc(it.desc)}</h2>
    <div class="fields">
      <div class="field"><div class="k">Material code</div><div class="v">${esc(it.mat)}</div></div>
      <div class="field"><div class="k">Barcode</div><div class="v">${esc(it.bc)}</div></div>
      <div class="field qty"><div class="k">Quantity</div><div class="v">${fmt(it.qty)}</div></div>
    </div>
    ${notes.map(n => `<span class="note">${esc(n)}</span>`).join('')}`;
  tone(1320, .09); buzz(40);
}
function showNotFound(code) {
  const el = $('result');
  el.className = 'result bad';
  el.innerHTML = `<div class="status">⚠ Warning</div>
    <p class="warnmsg">This material is not listed. Kindly check the outbound.</p>
    <p class="muted">Scanned code: <b>${esc(code)}</b></p>
    <button type="button" class="linkbtn" id="trySearch">Search by material code or description instead</button>`;
  $('trySearch').addEventListener('click', () => { $('search').focus(); $('search').scrollIntoView({ block: 'center', behavior: 'smooth' }); });
  tone(220, .22, 0, 'square', .1); tone(220, .3, .3, 'square', .1); buzz([120, 80, 220]);
}

function record(rec) {
  scans.unshift({ ...rec, id: 'l' + rec.at + Math.random().toString(36).slice(2, 6) });
  if (scans.length > 5000) scans.length = 5000;
  try { localStorage.setItem('t19-scans', JSON.stringify(scans)); } catch (e) {}
  render();
}

let lastCode = '', lastAt = 0;
function handleScan(raw) {
  const code = clean(raw);
  $('code').value = '';
  if (!code) return;
  const now = Date.now();
  if (code === lastCode && now - lastAt < 400) return;
  lastCode = code; lastAt = now;
  const hit = lookup(code);
  if (hit) showItem(hit.item, hit.via); else showNotFound(code);
  record({ code, ok: !!hit, mat: hit ? hit.item.mat : '', desc: hit ? hit.item.desc : '', qty: hit ? hit.item.qty : null, via: hit ? hit.via : '', at: now });
}
$('scanForm').addEventListener('submit', e => { e.preventDefault(); handleScan($('code').value); $('code').focus(); });
$('code').addEventListener('keydown', e => { if (e.key === 'Tab' && $('code').value) { e.preventDefault(); handleScan($('code').value); } });
// scanner input while nothing is focused goes to the scan box
document.addEventListener('keydown', e => {
  const a = document.activeElement;
  if (a && a.matches('input,textarea,button')) return;
  if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) $('code').focus();
});

// search
let searchTimer = null;
$('search').addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(runSearch, 120); });
function runSearch() {
  const q = $('search').value.trim().toLowerCase();
  const box = $('results');
  if (!q) { box.innerHTML = ''; return; }
  const words = q.split(/\s+/).filter(Boolean);
  const digits = /^\d+$/.test(q);
  let hits = ITEMS.filter(it => digits ? (it.mat.startsWith(q) || it.bc.includes(q)) : words.every(w => it.key.includes(w)));
  if (digits) hits.sort((a, b) => (b.mat === q) - (a.mat === q));
  if (!hits.length) { box.innerHTML = '<div class="nores">No matching material on Transfer 19.</div>'; return; }
  box.innerHTML = hits.slice(0, 40).map(it => `<button type="button" class="item" data-mat="${esc(it.mat)}">
      <span class="d"><b>${esc(it.desc)}</b><span>${esc(it.mat)} · ${esc(it.bc)}</span></span>
      <span class="q">Qty ${fmt(it.qty)}</span></button>`).join('') +
    (hits.length > 40 ? `<div class="nores">${hits.length - 40} more — type more to narrow down.</div>` : '');
}
$('results').addEventListener('click', e => {
  const b = e.target.closest('.item'); if (!b) return;
  const it = byMat.get(b.dataset.mat); if (!it) return;
  showItem(it, 'search');
  record({ code: it.mat, ok: true, mat: it.mat, desc: it.desc, qty: it.qty, via: 'search', at: Date.now() });
  $('search').value = ''; $('results').innerHTML = '';
  $('result').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  $('code').focus({ preventScroll: true });
});

// camera (photo)
let zx = null;
function loadZXing() {
  if (window.ZXing) return Promise.resolve();
  return zx ||= new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js';
    s.onload = res; s.onerror = () => { zx = null; rej(new Error('load')); };
    document.head.appendChild(s);
  });
}
$('camBtn').addEventListener('click', () => { $('camFile').value = ''; $('camFile').click(); loadZXing().catch(() => {}); });
$('camFile').addEventListener('change', async () => {
  const f = $('camFile').files[0]; if (!f) return;
  const btn = $('camBtn'); btn.disabled = true; btn.textContent = 'Reading…';
  const url = URL.createObjectURL(f);
  try {
    let text = null;
    if ('BarcodeDetector' in window) {
      try { const r = await new BarcodeDetector().detect(await createImageBitmap(f)); if (r.length) text = r[0].rawValue; } catch (e) {}
    }
    if (!text) {
      await loadZXing();
      const hints = new Map(); hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
      try { text = (await new ZXing.BrowserMultiFormatReader(hints).decodeFromImageUrl(url)).getText(); } catch (e) {}
    }
    if (text) handleScan(text);
    else {
      $('result').className = 'result idle';
      $('result').innerHTML = '<div class="status">No barcode found</div><p class="muted">Take the photo closer with the barcode flat and in focus, or search by material code or description below.</p>';
    }
  } catch (e) { notice('Camera reading needs internet the first time. Type the barcode or use search.'); }
  finally { URL.revokeObjectURL(url); btn.disabled = false; btn.textContent = 'Camera'; }
});

// log
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {
  filter = b.dataset.f;
  document.querySelectorAll('.tabs button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  render();
}));
const tfmt = t => new Date(t).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
function render() {
  const checked = new Set(scans.filter(s => s.ok).map(s => s.mat));
  $('sChecked').textContent = fmt(checked.size) + ' / ' + fmt(ITEMS.length);
  $('sLeft').textContent = fmt(ITEMS.length - checked.size);
  $('sScans').textContent = fmt(scans.length);
  $('sBad').textContent = fmt(scans.filter(s => !s.ok).length);
  const rows = filter === 'bad' ? scans.filter(s => !s.ok) : scans;
  if (!rows.length) { $('log').innerHTML = `<div class="empty">${filter === 'bad' ? 'No unlisted items scanned.' : 'No scans yet.'}</div>`; return; }
  $('log').innerHTML = `<table><thead><tr><th>Time</th><th>Item</th><th class="hide-sm">Material</th><th style="text-align:right">Qty</th></tr></thead><tbody>${
    rows.slice(0, 300).map(s => `<tr class="${s.ok ? '' : 'bad'}">
      <td class="n">${tfmt(s.at)}</td>
      <td>${s.ok ? esc(s.desc) : '<span class="tag">NOT LISTED</span>'}<div class="small n">${esc(s.code)}</div></td>
      <td class="n hide-sm">${esc(s.mat || '—')}</td>
      <td class="n r">${s.ok ? fmt(s.qty) : '—'}</td></tr>`).join('')}</tbody></table>`;
}
function notice(m) { $('notice').textContent = m; $('notice').hidden = !m; }

// export
const cell = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
function saveCsv(name, rows) {
  const blob = new Blob(['\ufeff' + rows.map(r => r.map(cell).join(',')).join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
$('exportBtn').addEventListener('click', () => saveCsv('transfer19-scan-log.csv',
  [['Time', 'Scanned code', 'Status', 'Material code', 'Description', 'Qty']].concat(
    scans.map(s => [new Date(s.at).toLocaleString('en-GB'), s.code, s.ok ? 'Listed' : 'NOT LISTED', s.mat, s.desc, s.ok ? s.qty : '']))));
$('exportLeft').addEventListener('click', () => {
  const checked = new Set(scans.filter(s => s.ok).map(s => s.mat));
  saveCsv('transfer19-remaining.csv', [['Material code', 'Description', 'Qty', 'Barcode']].concat(
    ITEMS.filter(it => !checked.has(it.mat)).map(it => [it.mat, it.desc, it.qty, it.bc])));
});

render();

// clear log (two-step, no browser dialogs)
let clearArm = 0;
$('clearBtn').addEventListener('click', () => {
  const b = $('clearBtn');
  if (Date.now() - clearArm < 4000) {
    scans = []; try { localStorage.removeItem('t19-scans'); } catch (e) {}
    render(); b.textContent = 'Clear log'; clearArm = 0; return;
  }
  clearArm = Date.now(); b.textContent = 'Tap again to clear';
  setTimeout(() => { if (Date.now() - clearArm >= 4000) b.textContent = 'Clear log'; }, 4100);
});
$('code').focus();
</script>

</body>
</html>
